# Built-in advisory database for `toolchain-verify agent`.
#
# Declarative on purpose: bump versions / add advisories here (or in your own
# file passed via [agent].advisories or --advisories) without code changes.
# Every entry must cite a public source in `refs`. Do not add identifiers
# you have not seen in a primary record (GitHub Advisory Database, CVE/NVD,
# OSV, vendor bulletin).
#
# [[stack]]      an agent framework that can execute code / shell / tools
#   name           unique id
#   ecosystem      "npm" | "pypi"
#   packages       package names (first one = main package; docker image tags map to it)
#   docker_images  image repositories whose tag is the version (compose files, Dockerfiles)
#   can_exec       true = the stack runs model-written code or shell commands
#   notes          short hardening hint
#
# [[advisory]]
#   id, aliases    advisory identifiers (GHSA / CVE / vendor bulletin)
#   stack          stack name
#   packages       optional subset/override of the stack's packages
#   affected       version constraint (toolchain-verify syntax) of vulnerable versions
#   fixed          first fixed version, or "" when no fix has been published
#   severity       "critical" | "high" | "medium" | "low"
#   action         "fail" (default) or "warn" (e.g. conditional or unconfirmed)
#   condition      when the issue applies (human-readable)
#   escalate_env   optional "NAME=value": if set in the scanning environment, a
#                  "warn" advisory becomes "fail"
#   summary, refs
#
# [[blocklist]]  known-malicious package names (any version)
#   ecosystem, name, reason, refs

schema = 1
updated = "2026-11-02"


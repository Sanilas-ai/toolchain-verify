eos_token = "<|im_end|>"
sources = [
  "https://huggingface.co/LiquidAI/LFM2-1.2B/raw/main/chat_template.jinja",
  "https://huggingface.co/LiquidAI/LFM2-1.2B/raw/main/tokenizer_config.json",
  "https://docs.liquid.ai/lfm/key-concepts/tool-use",
]
